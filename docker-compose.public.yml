services:
  # 1. Message Queue (Valkey)
  valkey:
    image: valkey/valkey
    ports:
      - 6379:6379
    volumes:
      - valkey_data:/data

  # 2. Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
    volumes:
      - qdrant_data:/qdrant/storage

  # 3. Backend API (Express)
  server:
    image: garry27/pdf-rag-server:latest
    ports:
      - 8000:8000
    depends_on:
      - valkey
      - qdrant
    volumes:
      - server_uploads:/app/uploads
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - QDRANT_URL=http://qdrant:6333
      - FRONTEND_URL=http://localhost:3000
      # Required API Keys:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JINA_API_KEY=${JINA_API_KEY}

  # 4. Background Worker (BullMQ)
  worker:
    image: garry27/pdf-rag-worker:latest
    depends_on:
      - valkey
      - qdrant
      - server
    volumes:
      - server_uploads:/app/uploads
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - QDRANT_URL=http://qdrant:6333
      # Required API Keys:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JINA_API_KEY=${JINA_API_KEY}

  # 5. Frontend UI (Next.js)
  client:
    image: garry27/pdf-rag-client:latest
    ports:
      - 3000:3000
    depends_on:
      - server
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Required Clerk Keys:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}

volumes:
  valkey_data:
  qdrant_data:
  server_uploads:
